name: "Temporary alpha.11 version bump"
on:
  push:
    branches:
      - feat/timeline-pointer-drag-scrub-alpha11-20261013
    paths:
      - .github/workflows/zve-alpha11-version.yml
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/timeline-pointer-drag-scrub-alpha11-20261013
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run canonical version scripts
        run: |
          node scripts/set-version.mjs 0.1.0-alpha.11 --note "Непрерывная кадрово-точная перемотка по линейке таймлайна при перетаскивании курсора без изменений проекта."
          node scripts/check-version.mjs
      - name: Commit synchronized source version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore(version): canonical desktop alpha.11 bump"
          git push origin HEAD:feat/timeline-pointer-drag-scrub-alpha11-20261013
