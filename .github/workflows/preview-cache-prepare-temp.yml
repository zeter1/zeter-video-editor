name: Prepare preview cache alpha17 (temporary)
on:
  push:
    branches: [feat/preview-cache-safe-chunk-alpha17-20261013]
permissions:
  contents: write
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, '[preview-prepared]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup component add --toolchain 1.99.0 rustfmt
          rustup override set 1.99.0
      - name: Canonical version bump and format
        shell: pwsh
        run: |
          node scripts/set-version.mjs 0.1.0-alpha.17 --note "Безопасный проектный кэш FFmpeg-фрагментов Preview с проверкой источников, отменой и FFprobe"
          cargo fmt --all
          node scripts/check-version.mjs
      - name: Focused Rust cache regression
        run: cargo test -p media-engine --test preview_cache_job
      - name: Commit generated version and formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore(preview): canonical alpha17 version and rustfmt [preview-prepared]"
          git push
