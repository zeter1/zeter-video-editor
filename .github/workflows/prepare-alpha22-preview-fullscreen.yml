name: Branch-only canonical alpha.22 bump
on:
  push:
    branches:
      - feat/preview-fullscreen-alpha22-20261014
permissions:
  contents: write
jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[prepare-alpha22]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Execute canonical version script and verify
        shell: bash
        run: |
          set -euo pipefail
          node scripts/set-version.mjs 0.1.0-alpha.22 --note "Добавлен полноэкранный предпросмотр видео с выходом и защитой от отказа WebView2"
          node scripts/check-version.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml Cargo.lock release/runtime-manifest.json README.md PROJECT_STATUS.md CHANGELOG.md
          git commit -m 'chore: prepare alpha.22 with canonical version script [prepare-alpha22]'
          git push origin HEAD:feat/preview-fullscreen-alpha22-20261014
