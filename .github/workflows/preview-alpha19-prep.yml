name: Temporary branch Rust formatting (alpha.19)

on:
  push:
    branches: [feat/preview-adjacent-prefetch-alpha19-20261013]

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-alpha19]')
    runs-on: windows-latest
    steps:
      - name: Checkout branch with write credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Pinned Rust formatting toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup component add --toolchain 1.99.0 rustfmt
          rustup override set 1.99.0
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add apps/desktop/src-tauri/src/preview_composite.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: canonical Rust formatting for bounded prefetch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:feat/preview-adjacent-prefetch-alpha19-20261013
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
