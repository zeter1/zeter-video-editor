# TEMPORARY branch-only helper. Must be deleted from the product PR.
name: Preview alpha18 version and formatting (temporary)
on:
  push:
    branches:
      - feat/preview-opaque-composite-paused-20261013
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check canonical version result
        run: node scripts/check-version.mjs
      - name: Rust formatting
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          cargo +1.99.0 fmt --all
      - name: Commit generated source versions and Rust formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(preview): canonical alpha.18 version and rustfmt"
          git push origin "HEAD:${GITHUB_REF}"
