name: ZVE-003e temporary canonical version sync
on:
  push:
    branches:
      - feat/timeline-frame-grid-nudge-alpha9-20261013
    paths:
      - .github/workflows/zve003e-version-sync.yml
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Execute canonical desktop version script
        run: |
          node scripts/set-version.mjs 0.1.0-alpha.9 --note "Кадр-точное перемещение курсора стрелками без накопления ошибки на дробном FPS"
          node scripts/check-version.mjs
      - name: Commit scripted files back to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json release/runtime-manifest.json apps/desktop/src-tauri/Cargo.toml Cargo.lock README.md PROJECT_STATUS.md CHANGELOG.md
          git commit -m "chore(version): bump desktop source to alpha.9"
          git push origin HEAD:feat/timeline-frame-grid-nudge-alpha9-20261013
