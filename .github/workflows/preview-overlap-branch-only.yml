name: Preview fallback TDD and canonical version sync

on:
  push:
    branches: [fix/preview-overlap-still-fallback-alpha13-20261013]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
        working-directory: apps/desktop
      - run: npm test -- --run src/preview/PreviewCompositeFallback.test.tsx
        working-directory: apps/desktop
      - name: Canonical desktop alpha.13 version synchronization
        shell: bash
        run: |
          current=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$current" = "0.1.0-alpha.13" ]; then
            node scripts/check-version.mjs
            exit 0
          fi
          if [ "$current" != "0.1.0-alpha.12" ]; then
            echo "Unexpected base desktop version: $current"
            exit 1
          fi
          node scripts/set-version.mjs 0.1.0-alpha.13 --note "Исправлен предпросмотр перекрывающихся видеоклипов со статичным наложением: сохраняется верхнее видео и предупреждение о неполном композитинге; тесты Vitest, проекты и экспорт не изменены."
          node scripts/check-version.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml Cargo.lock release/runtime-manifest.json README.md PROJECT_STATUS.md CHANGELOG.md
          git commit -m "chore(version): synchronize preview fallback alpha.13 via canonical script"
          git push origin HEAD:fix/preview-overlap-still-fallback-alpha13-20261013
