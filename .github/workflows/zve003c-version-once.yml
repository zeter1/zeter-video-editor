name: ZVE-003c canonical version bump (temporary)
on:
  push:
    branches: [feat/timeline-adjacent-marker-navigation-alpha7-20261013]
    paths:
      - .github/workflows/zve003c-version-once.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Execute mandatory canonical version script and validation
        run: |
          node scripts/set-version.mjs 0.1.0-alpha.7 --note "Добавлена навигация между соседними маркерами без изменения проекта."
          node scripts/check-version.mjs
      - name: Commit scripted files only into isolated PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml Cargo.lock release/runtime-manifest.json README.md PROJECT_STATUS.md CHANGELOG.md
          git commit -m "chore(version): bump ZVE-003c to alpha.7 through set-version"
          git push origin HEAD:refs/heads/feat/timeline-adjacent-marker-navigation-alpha7-20261013
