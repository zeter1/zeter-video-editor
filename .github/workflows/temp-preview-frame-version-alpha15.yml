name: Temporary alpha.15 version sync (branch only)
on:
  push:
    branches: [fix/preview-fractional-frame-step-alpha15-20261013]
permissions:
  contents: write
jobs:
  sync-version:
    if: github.ref == 'refs/heads/fix/preview-fractional-frame-step-alpha15-20261013'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Canonical desktop version sync
        run: |
          node scripts/set-version.mjs 0.1.0-alpha.15 --note "Исправлена кадровая навигация предпросмотра при дробной частоте кадров и конечных границах"
          node scripts/check-version.mjs
      - name: Commit synchronized source manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml Cargo.lock release/runtime-manifest.json README.md PROJECT_STATUS.md CHANGELOG.md
          git commit -m "chore(version): canonical alpha.15 desktop source sync"
          git push origin HEAD:fix/preview-fractional-frame-step-alpha15-20261013
