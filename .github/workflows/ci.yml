name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Select Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Rust tests
        run: cargo test --workspace

      - name: Frontend tests
        run: npm test -- --run
        working-directory: apps/desktop

      - name: Frontend build
        run: npm run build
        working-directory: apps/desktop

      - name: Build AI worker for bundle smoke
        run: cargo build -p zeter-ai-worker

      - name: Stage managed runtime for bundle smoke
        shell: pwsh
        run: |
          $ffmpeg = (Get-Command ffmpeg.exe -ErrorAction Stop).Source
          $ffprobe = (Get-Command ffprobe.exe -ErrorAction Stop).Source
          $worker = Resolve-Path "target/x86_64-pc-windows-msvc/debug/zeter-ai-worker.exe"
          ./scripts/stage-managed-runtime.ps1 -FfmpegPath $ffmpeg -FfprobePath $ffprobe -AiWorkerPath $worker

      - name: Tauri debug bundle smoke
        working-directory: apps/desktop
        run: npm run tauri build -- --debug --bundles nsis --config ../../release/tauri.debug.conf.json
