name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      ZETER_CI_FFMPEG_ARCHIVE_URL: https://github.com/GyanD/codexffmpeg/releases/download/8.0.1/ffmpeg-8.0.1-full_build.zip
      ZETER_CI_FFMPEG_ARCHIVE_SHA256: 467cde100a47ed4b03a897988aeb4a296890c1e2b2d2864204657d002bc5fb90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Select Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup component add --toolchain 1.99.0 rustfmt
          rustup override set 1.99.0
          rustc --version
          cargo --version
          rustfmt --version

      - name: Test version and release scripts
        run: node --test scripts/version-policy.test.mjs

      - name: Verify app version and changelog
        run: node scripts/check-version.mjs

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Frontend build
        run: npm run build
        working-directory: apps/desktop

      # TypeScript's app tsconfig excludes Playwright specs. Parse them early
      # so a syntax error fails before costly native Rust/FFmpeg work.
      - name: Validate Playwright E2E specs
        run: npx playwright test --list
        working-directory: apps/desktop

      - name: Download and verify pinned FFmpeg runtime
        shell: pwsh
        run: ./scripts/fetch-ffmpeg-runtime.ps1 -Url $env:ZETER_CI_FFMPEG_ARCHIVE_URL -Sha256 $env:ZETER_CI_FFMPEG_ARCHIVE_SHA256 -OutputDir "$env:RUNNER_TEMP/ffmpeg-runtime"

      - name: Build AI worker and fixture whisper probe for tests and bundle smoke
        run: cargo build -p zeter-ai-worker --bin zeter-ai-worker --bin zeter-ai-fixture-worker

      - name: Stage managed runtime for tests and bundle smoke
        shell: pwsh
        run: |
          $paths = Get-Content "$env:RUNNER_TEMP/ffmpeg-runtime/paths.json" | ConvertFrom-Json
          $worker = Resolve-Path "target/x86_64-pc-windows-msvc/debug/zeter-ai-worker.exe"
          $whisper = Resolve-Path "target/x86_64-pc-windows-msvc/debug/zeter-ai-fixture-worker.exe"
          ./scripts/stage-managed-runtime.ps1 -FfmpegPath $paths.ffmpeg -FfprobePath $paths.ffprobe -WhisperCliPath $whisper -AiWorkerPath $worker

      - name: Rust tests
        shell: pwsh
        run: |
          $paths = Get-Content "$env:RUNNER_TEMP/ffmpeg-runtime/paths.json" | ConvertFrom-Json
          $env:ZETER_TEST_FFMPEG_DIR = Split-Path $paths.ffmpeg -Parent
          cargo test --workspace

      - name: Frontend tests
        run: npm test -- --run
        working-directory: apps/desktop

      # Run the SAME complete native acceptance suite across four Playwright
      # shards. Each command starts a fresh Tauri/WebView2/CDP process, limiting
      # long-lived native decoder/GPU state: CI has intermittently lost the
      # preview/CDP browser at test 33-37 while the same tests pass individually.
      # Sharding does NOT skip, relax, mock or retry tests: all 4 shards,
      # BOTH byte-starvation cases, the 2x A/V drift and secondary embedded-AAC
      # pause test must pass in fresh processes. On the post-merge main CI
      # #43893029007 the secondary test's follower failed to pause after 14
      # earlier native cases in one shard; do not reuse that decoder session.
      # Isolated acceptance keeps the original native video/audio assertions.
      # ZVE-024's 49-test suite uses 4 shards: 14+16+4+11, not 3 shards
      # (30+0+15, which would make Playwright fail on an empty shard).
      - name: End-to-end MVP acceptance (four fresh WebView2 sessions)
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $paths = Get-Content "$env:RUNNER_TEMP/ffmpeg-runtime/paths.json" | ConvertFrom-Json
          $env:ZETER_TEST_FFMPEG_DIR = Split-Path $paths.ffmpeg -Parent
          for ($shard = 1; $shard -le 4; $shard++) {
            Write-Host "Native E2E acceptance: fresh WebView2 process, shard $shard/4"
            npm run test:e2e -- --grep-invert 'actual mid-play 206 byte starvation|real delayed media bytes recover|2x compositor frame stays aligned|native lower video audio follows' --shard "$shard/4"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Native pre-play delayed-byte-starvation acceptance (isolated WebView2)
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $paths = Get-Content "$env:RUNNER_TEMP/ffmpeg-runtime/paths.json" | ConvertFrom-Json
          $env:ZETER_TEST_FFMPEG_DIR = Split-Path $paths.ffmpeg -Parent
          npm run test:e2e -- --grep 'real delayed media bytes recover'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native mid-play 206 byte-starvation acceptance (isolated WebView2)
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $paths = Get-Content "$env:RUNNER_TEMP/ffmpeg-runtime/paths.json" | ConvertFrom-Json
          $env:ZETER_TEST_FFMPEG_DIR = Split-Path $paths.ffmpeg -Parent
          npm run test:e2e -- --grep 'actual mid-play 206 byte starvation'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native sustained 2x A/V drift acceptance (isolated WebView2)
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $paths = Get-Content "$env:RUNNER_TEMP/ffmpeg-runtime/paths.json" | ConvertFrom-Json
          $env:ZETER_TEST_FFMPEG_DIR = Split-Path $paths.ffmpeg -Parent
          npm run test:e2e -- --grep '2x compositor frame stays aligned'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native lower-video embedded AAC Pause acceptance (isolated WebView2)
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $paths = Get-Content "$env:RUNNER_TEMP/ffmpeg-runtime/paths.json" | ConvertFrom-Json
          $env:ZETER_TEST_FFMPEG_DIR = Split-Path $paths.ffmpeg -Parent
          npm run test:e2e -- --grep 'native lower video audio follows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tauri debug bundle smoke
        working-directory: apps/desktop
        run: npm run tauri build -- --debug --bundles nsis --config ../../release/tauri.debug.conf.json
      
      - name: Upload Windows preview installer for manual testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeter-video-editor-windows-preview-x64
          path: target/x86_64-pc-windows-msvc/debug/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
