name: ZVE-008 one-shot version and rustfmt
on:
  push:
    branches: [feat/zve-008-editable-titles-20261015]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Format Rust and update prerelease with canonical script
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup component add --toolchain 1.99.0 rustfmt
          rustup override set 1.99.0
          node scripts/check-version.mjs
          node scripts/set-version.mjs 0.1.0-alpha.26 --note "Редактируемые титры через Rust Core, Inspector и предпросмотр"
          cargo fmt --all
          node scripts/check-version.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(titles): canonical alpha.26 version bump and rustfmt"
          git push origin HEAD:feat/zve-008-editable-titles-20261015
