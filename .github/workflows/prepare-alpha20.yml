name: Prepare alpha.20 (temporary branch-only)
on:
  push:
    branches: ["fix/preview-paused-presentation-race-alpha20-20261014"]
    paths:
      - ".github/workflows/prepare-alpha20.yml"
permissions:
  contents: write
jobs:
  version:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Canonically advance desktop source version
        shell: pwsh
        run: |
          node scripts/set-version.mjs 0.1.0-alpha.20 --note "Fix paused WebView2 frame readiness race after native seek" 
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-version.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml Cargo.lock release/runtime-manifest.json README.md PROJECT_STATUS.md CHANGELOG.md
          git commit -m "chore: prepare alpha.20 with canonical version script [prepare-alpha20]"
          git push origin HEAD:fix/preview-paused-presentation-race-alpha20-20261014
