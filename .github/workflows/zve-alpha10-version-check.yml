name: ZVE alpha10 version sync verification (temporary)
on:
  push:
    branches:
      - feat/timeline-pointer-frame-snap-alpha10-20261013
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute canonical version script against alpha.9 checkout
        run: |
          node scripts/check-version.mjs
          node scripts/set-version.mjs 0.1.0-alpha.10 --note "Snap timeline ruler clicks to exact frame positions at fractional FPS"
          node scripts/check-version.mjs
          git diff --stat
