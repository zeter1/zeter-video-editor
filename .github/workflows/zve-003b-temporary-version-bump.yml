# Temporary branch-scoped helper. Remove before PR merge.
name: ZVE-003b temporary version bump
on:
  push:
    branches:
      - feat/timeline-marker-safe-navigation-alpha6-20261012
    paths:
      - .github/workflows/zve-003b-temporary-version-bump.yml
permissions:
  contents: write
jobs:
  run-version-script:
    if: github.repository == 'zeter1/zeter-video-editor' && github.ref == 'refs/heads/feat/timeline-marker-safe-navigation-alpha6-20261012'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run checked-in version bump script
        run: >-
          node scripts/set-version.mjs 0.1.0-alpha.6
          --note "Маркер на таймлайне теперь перемещает курсор без удаления; отдельная кнопка удаляет маркер через отменяемую команду Rust. PR #65, исходные медиа, экспорт и формат vcut не меняются."
      - name: Check synchronized app version
        run: node scripts/check-version.mjs
      - name: Commit only the script's version files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml Cargo.lock release/runtime-manifest.json README.md PROJECT_STATUS.md CHANGELOG.md
          git diff --cached --check
          git commit -m "chore(version): update desktop to alpha.6 via set-version script"
          git push origin HEAD:refs/heads/feat/timeline-marker-safe-navigation-alpha6-20261012
