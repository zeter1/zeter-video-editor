name: ZVE-007 one-time version bump
on:
  push:
    branches: [feat/zve-007-multi-sequence-workspace-20261015]
permissions:
  contents: write
jobs:
  set-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use the canonical version policy script
        run: |
          node scripts/set-version.mjs 0.1.0-alpha.25 --note "Выбор и создание отдельных 16:9 и 9:16 последовательностей с правильным монтажом и экспортом"
          node scripts/check-version.mjs
      - name: Commit synchronized desktop manifests to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md PROJECT_STATUS.md Cargo.lock apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/tauri.conf.json release/runtime-manifest.json
          git commit -m 'chore(version): bump desktop to 0.1.0-alpha.25 via canonical script'
          git push origin HEAD:feat/zve-007-multi-sequence-workspace-20261015
