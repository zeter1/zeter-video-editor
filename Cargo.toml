[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "apps/ai-worker",
  "crates/editor-core",
  "crates/media-engine",
  "crates/ai-engine",
  "crates/project-io",
  "crates/job-system",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
